name: Portfolio preview checks

on:
  push:
    branches:
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project packages
        run: npm ci --legacy-peer-deps
      - name: Build
        run: CI=false npm run build
      - name: Install Playwright browser
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start preview and run browser smoke checks
        run: |
          npx serve -s build -l 4173 > /tmp/portfolio-preview.log 2>&1 &
          node tests/preview-smoke.cjs
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-screenshots
          path: preview-screenshots/
          if-no-files-found: ignore
